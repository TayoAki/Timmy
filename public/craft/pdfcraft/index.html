<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="craft-app" content="pdfcraft">
  <title>PDF editor</title>
    <!-- Recognises text off the page's thread (crates/ui-egui/src/workflows/ocr_web.rs). -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
  </head>
  <body>
    <canvas id="pdfcraft"></canvas>
  <script type="module">
  // Timmy hosts this page: the .wasm ships gzipped and is decompressed here. If it can't
  // start, the page says so and tells a hosting page (?host=parent) at once.
  import init, * as bindings from './pdfcraft-web.js';
  async function wasm() {
    const res = await fetch('./pdfcraft-web_bg.wasmz');
    if (!res.ok) throw new Error('could not download it (HTTP ' + res.status + ')');
    return new Response(res.body.pipeThrough(new DecompressionStream('gzip')), { headers: { 'Content-Type': 'application/wasm' } });
  }
  try {
    const instance = await init({ module_or_path: wasm() });
    window.wasmBindings = bindings;
    dispatchEvent(new CustomEvent('TrunkApplicationStarted', { detail: { wasm: instance } }));
  } catch (err) {
    const message = 'The pdf editor couldn’t start: ' + (err && err.message ? err.message : err);
    const note = document.getElementById('pdfcraft_loading');
    if (note) note.textContent = message;
    if (new URLSearchParams(location.search).get('host') === 'parent' && window.parent !== window) {
      window.parent.postMessage({ type: 'pdfcraft:failed', version: '1', error: message }, location.origin);
    }
  }
</script>
</body>
</html>
